<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log-in</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!--========= Parent Div/Container======= -->
    <div class="container log-in-div">
        <label for="log-in-form" class="label" id="title">Log-in</label>
        <!--======= form section/Input field form ======-->
        <form action="#" id="log-in-form">

            <!--====== input field for username====== -->
            <div class="input-div" id="user-name-div">
                <label for="username" class="label">User Name</label>
                <input type="text" id="username" class="input" placeholder="Enter username">
            </div>

            <!--========== input field for password============-->
            <div class="input-div" id="password-div">
                <label for="password" class="label">Password</label>
                <input type="text" id="password" class="input" placeholder="Enter password">
            </div>
            
            <button id="submit-bnt" class="buttons">Submit</button>
        </form>

        <p>New user! click <a href="">here</a> to sign up</p>
        
    </div>
</body>

<script src="script.js"></script>
</html>
